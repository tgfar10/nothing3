name: Build

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force

          # Require Network Level Authentication
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 1 -Force

          # Firewall rule for RDP
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Configure runneradmin for RDP
        run: |
          $username = "runneradmin"
          $password = "P@ssw0rd123!"

          Enable-LocalUser -Name $username
          Set-LocalUser -Name $username -Password (ConvertTo-SecureString -AsPlainText $password -Force)
          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue

          echo "RDP_USER=$username" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.102.4-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=$env:TAILSCALE_AUTHKEY `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: WARMUP
        env:
          TG_SESSION_DATA: ${{ secrets.TG_SESSION_DATA }}
        run: |
          $publicDesktop = "C:\Users\Public\Desktop"
          $extractDir = "$publicDesktop\bundle_extracted"
          $zipUrl = "https://pcdrive.m-jihad3k.workers.dev/bundle.zip"
          $zipFile = "$env:TEMP\bundle.zip"
          $logFile = "$publicDesktop\bot_log.txt"

          Write-Host "[1/5] Downloading bundle.zip..."
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipFile

          Write-Host "[2/5] Extracting bundle to Desktop..."
          if (!(Test-Path $extractDir)) { New-Item -ItemType Directory -Path $extractDir -Force }
          Expand-Archive -Path $zipFile -DestinationPath $extractDir -Force
          Remove-Item $zipFile -Force

          Write-Host "[3/5] Creating session.dat silently..."
          if ($env:TG_SESSION_DATA -and $env:TG_SESSION_DATA -ne "null") {
              [System.IO.File]::WriteAllText("$extractDir\session.dat", $env:TG_SESSION_DATA.Trim())
              Write-Host "session.dat created."
          } else {
              Write-Host "TG_SESSION_DATA is empty or null, skipping session.dat."
          }

          Write-Host "[4/5] Installing requirements..."
          if (Test-Path "$extractDir\requirements.txt") {
              pip install -r "$extractDir\requirements.txt"
          }

          Write-Host "[5/5] Launching run_session.py in background..."
          if (Test-Path "$extractDir\run_session.py") {
              Start-Process -FilePath "python.exe" -ArgumentList "run_session.py" -WorkingDirectory $extractDir -RedirectStandardOutput $logFile -RedirectStandardError $logFile
              Write-Host "run_session.py started! Live logs streaming to Desktop\bot_log.txt"
          } else {
              Write-Warning "run_session.py not found in $extractDir"
          }

          # Copy run.bat to Desktop for manual rerun if needed
          $batSource = Join-Path $env:GITHUB_WORKSPACE "run.bat"
          if (Test-Path $batSource) {
              Copy-Item -Path $batSource -Destination (Join-Path $publicDesktop "run.bat") -Force
          }

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_PASS"
          Write-Host "==================`n"

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
